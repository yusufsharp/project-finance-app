global
    log stdout format raw local0
defaults
    log global
    mode tcp
    timeout connect 2s
    timeout client 120s
    timeout server 120s
listen amqp
    bind :5672
    balance roundrobin
    default-server inter 1s fall 2 rise 1 on-marked-down shutdown-sessions
    server rabbit1 rabbit1:5672 check
    server rabbit2 rabbit2:5672 check
    server rabbit3 rabbit3:5672 check
