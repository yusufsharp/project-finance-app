server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 16k;
    add_header Cache-Control no-cache always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    location = /health/frontend { access_log off; return 200 'ok'; }
    # Docker DNS is resolved per request so API restarts do not leave a stale IP.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api http://operations:8080;
    location = /health/ready { proxy_pass $api; }
    location = /api { proxy_pass $api/; }
    location ~ ^/operations(?:/|$) {
        proxy_pass $api;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
